name: CI

# The gate for every change: it compiles, runs the unit tests, runs lint against the baseline of known issues and
# builds the debug APK. Runs on every pull request (to any branch, so stacked ones are covered too) and when main moves.
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

# A newer run of the same pull request (or branch) makes the older one pointless.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Fast: the format of the Kotlin files this change touches (the older code is not held to it until it is touched).
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install ktlint
        run: scripts/ci/install-ktlint.sh "$HOME/.local/bin"

      - name: Check the format of the changed Kotlin files
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          git fetch --no-tags origin "$BASE_REF"
          # A push to main has nothing to compare with: the commit before it is the base.
          if [ "${{ github.event_name }}" = "push" ]; then
            base="${{ github.event.before }}"
            # A branch pushed for the first time has no commit before it.
            if [ "$base" = "0000000000000000000000000000000000000000" ]; then base="HEAD~1"; fi
          else
            base="origin/$BASE_REF"
          fi
          scripts/format-check.sh "$base"

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Sonar needs the history to know which lines are new.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # Runs the unit tests with JaCoCo and writes app/build/reports/coverage/test/debug/report.xml.
      - name: Unit tests with coverage
        run: ./gradlew :app:createDebugUnitTestCoverageReport --stacktrace

      - name: Lint (new issues only; the known ones are in app/lint-baseline.xml)
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Build the debug APK
        run: ./gradlew :app:assembleDebug -Ppixelplay.enableAbiSplits=true --stacktrace

      # The debug key lives in the repo (debug.keystore) so every machine signs the same; if this changes, debug
      # builds stop installing over each other. When the key is replaced on purpose, update the digest here and in CONTRIBUTING.md.
      - name: Check the debug APK is signed with the project key
        run: |
          EXPECTED=0b4b77b5ed47520142555589d70cfc0a9b213cee290c83ab0c3ccc75eafb4337
          BUILD_TOOLS_VERSION="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          for apk in app/build/outputs/apk/debug/app-arm64-v8a-debug.apk app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk; do
            ACTUAL="$("$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner" verify --print-certs "$apk" | sed -n 's/^.*SHA-256 digest: //p' | head -n 1)"
            echo "$apk $ACTUAL"
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "::error::$apk is not signed with the project debug key (expected $EXPECTED)"
              exit 1
            fi
          done

      # Sends the sources, the compiled classes and the coverage to SonarQube Cloud (settings: sonar-project.properties).
      # Skipped when there is no token: pull requests from forks and from Dependabot do not get the secrets.
      - name: SonarQube Cloud analysis
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Upload the coverage report
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-report
          path: app/build/reports/coverage/test/debug/report.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Upload the reports when something failed
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ci-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

name: CI

# The gate for every change: it compiles, runs the unit tests, runs lint against the baseline of known issues and
# builds the debug APK. Runs on every pull request (to any branch, so stacked ones are covered too) and when main moves.
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

# A newer run of the same pull request (or branch) makes the older one pointless.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Lint (new issues only; the known ones are in app/lint-baseline.xml)
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Build the debug APK
        run: ./gradlew :app:assembleDebug -Ppixelplay.enableAbiSplits=true --stacktrace

      - name: Upload the reports when something failed
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ci-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

# SonarQube Cloud analysis, run by the `verify` job of .github/workflows/ci.yml (the automatic analysis is switched off).
sonar.host.url=https://sonarcloud.io
sonar.organization=poncegl
sonar.projectKey=PonceGL_PixelPlayer
sonar.projectName=PixelPlayer

sonar.sourceEncoding=UTF-8

# Only the phone app for now: it is the module whose unit tests are measured. wear/ and shared/ are not analysed yet.
sonar.sources=app/src/main/java
sonar.tests=app/src/test/java
sonar.exclusions=**/R.class,**/BuildConfig.*,**/build/**

# Classes compiled by the previous steps of the job, and the JaCoCo report of the unit tests.
sonar.java.binaries=app/build/intermediates/built_in_kotlinc/debug/compileDebugKotlin/classes,app/build/intermediates/javac/debug/compileDebugJavaWithJavac/classes
sonar.java.test.binaries=app/build/intermediates/built_in_kotlinc/debugUnitTest/compileDebugUnitTestKotlin/classes
sonar.coverage.jacoco.xmlReportPaths=app/build/reports/coverage/test/debug/report.xml
